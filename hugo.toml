baseURL = "https://hivevm.org/"
locale = "en-us"
title = "HiveVM"
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Model once, run anywhere"
  description = "Model your application once and run it anywhere: tools that describe application and business logic as models, independent of platform, heading toward agentic development."
  github_org = "https://github.com/hivevm"
  # "Get started" routes visitors into NUC's template flow — a new project from the template.
  start_url = "https://github.com/hivevm/nuc/generate"
  # Preview image for shared links; a page can override it with "image" in its front matter.
  og_image = "/assets/hive-texture.jpg"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    tabWidth = 2
    guessSyntax = false
