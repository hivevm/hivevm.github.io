baseURL = "https://hivevm.org/"
locale = "en-us"
title = "HiveVM"
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]

[params]
  tagline = "Model once, run anywhere"
  description = "Model your application once and run it anywhere — tools and projects that describe application and business logic as models, independent of technology and platform."
  github_org = "https://github.com/hivevm"
  # "Get started" routes visitors into NUC's template flow — a new project from the template.
  start_url = "https://github.com/hivevm/nuc/generate"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    tabWidth = 2
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
