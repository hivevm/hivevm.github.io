{{- /* Same table as Hugo's default, inside a keyboard-focusable box that scrolls when the table is too wide. */ -}}
<div class="table-wrap" tabindex="0" role="group" aria-label="Table">
  <table{{ range $k, $v := .Attributes }} {{ $k }}="{{ $v }}"{{ end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
{{- /* */ -}}
