<header class="site" data-nav>
  <div class="container">
    <nav class="nav" aria-label="Main">
      <div class="nav-left">
        <a href="{{ "/" | relURL }}#welcome" class="logo" aria-label="HiveVM home">
          {{ partial "logo.html" . }}
          <span class="name">Hive<em>VM</em></span>
        </a>
        <ul class="nav-links">
          {{- range hugo.Data.nav -}}
          <li>{{ partial "nav-link.html" . }}</li>
          {{- end -}}
        </ul>
      </div>

      <div class="nav-right">
        {{ partial "theme-toggle.html" . }}
        <button type="button" class="menu-btn" data-menu-button aria-expanded="false" aria-controls="mobile-menu"
          aria-label="Menu">
          <svg class="open" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M3 5.5h14M3 10h14M3 14.5h14" />
          </svg>
          <svg class="close" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15" />
          </svg>
        </button>
      </div>
    </nav>
  </div>

  <div id="mobile-menu" class="mobile-menu" data-menu-panel>
    <div class="container" style="padding-block:0.75rem">
      <ul>
        {{- range hugo.Data.nav -}}
        <li>{{ partial "nav-link.html" . }}</li>
        {{- end -}}
      </ul>
    </div>
  </div>
</header>
