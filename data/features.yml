# Text + links live here. The per-card visual (tree / chips / stages) is
# selected by `visual` and rendered in layouts/partials/home/features.html.
- id: parser
  num: "01"
  title: Parser Generator (Waggle)
  body: >-
    LL(k) parser generator for context-free grammars. Generates a parser and a
    full AST (Abstract Syntax Tree) for <code>Java</code>, <code>C++</code>
    &amp; <code>Rust</code> from a single <code>.waggle</code> grammar.
  repo: https://github.com/hivevm/waggle
  span: span-sm-2 lg-4
  visual: tree

- id: nectar
  num: "02"
  title: Documentation Generator (Nectar)
  body: >-
    Documentation generator in <code>Rust</code>. Write your docs once in
    <code>Markdown</code> and publish them as a website and a PDF from the same
    engine.
  repo: https://github.com/hivevm/nectar
  span: lg-2
  visual: chips

- id: nuc
  num: "03"
  title: Agent Template (NUC)
  body: >-
    A starting point for building software with coding agents inside a
    ready-to-use Dev Container. Work is driven by a written specification and
    <code>ADRs</code>, with <code>AGENTS.md</code> as the single source of truth
    for every agent.
  repo: https://github.com/hivevm/nuc
  span: lg-2
  visual: none

- id: ocelli
  num: "04"
  title: Git Client (Ocelli)
  body: >-
    View and edit Git repositories through a readable commit graph, on the
    desktop and in the terminal: each branch keeps its own lane, and merges
    stay easy to follow.
  repo: https://github.com/hivevm/ocelli
  span: lg-4
  visual: none

- id: comb
  num: "05"
  title: Node Editor (Comb)
  body: >-
    Node-editor framework for the browser, built to stay responsive with tens of
    thousands of nodes. Draws on a <code>WebGL2</code> canvas, computes geometry
    in <code>Rust</code> compiled to WebAssembly and leaves every form to your
    application.
  repo: https://github.com/hivevm/comb
  span: lg-3
  visual: none

- id: forager
  num: "06"
  title: Map Renderer (Forager)
  body: >-
    Renders maps with the styling semantics of UMN MapServer. Reads
    <code>mapfiles</code> and rasterizes them itself, in the browser as
    WebAssembly and on the server as a <code>Rust</code> library.
  repo: https://github.com/hivevm/forager
  span: lg-3
  visual: none

- id: targets
  title: Multiple targets, one model
  body: >-
    The same grammar emits idiomatic <code>Java</code>, <code>C++</code> and <code>Rust</code> —
    keep one source of truth and let HiveVM project it onto each language.
  span: lg-6
  visual: none
